<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真心话大冒险 · Vérité</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg-deep: #08080f;
    --bg-card: rgba(18, 18, 36, 0.75);
    --gold: #c9a96e;
    --gold-light: #e0c78a;
    --gold-dim: #8a7040;
    --text: #e0d8cc;
    --text-dim: #9a9488;
    --text-bright: #f5efe4;
    --accent-truth: #6eb5c9;
    --accent-dare: #c97e6e;
    --border: rgba(201, 169, 110, 0.18);
    --glow-truth: rgba(110, 181, 201, 0.5);
    --glow-dare: rgba(201, 126, 110, 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: var(--text);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Subtle background grain via pseudo-element */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Canvas Background ── */
  #particles {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  /* ── Ambient Glow Orbs ── */
  .ambient-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.06;
    pointer-events: none;
    z-index: 0;
    animation: orbDrift 20s ease-in-out infinite;
  }
  .ambient-orb.orb-1 { width: 500px; height: 500px; background: #c9a96e; top: -15%; left: -10%; animation-delay: 0s; }
  .ambient-orb.orb-2 { width: 400px; height: 400px; background: #6eb5c9; bottom: -10%; right: -8%; animation-delay: -7s; }
  .ambient-orb.orb-3 { width: 350px; height: 350px; background: #c97e6e; top: 40%; left: 55%; animation-delay: -14s; }

  @keyframes orbDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(40px, -30px) scale(1.15); }
    50% { transform: translate(-20px, 20px) scale(0.9); }
    75% { transform: translate(-30px, -10px) scale(1.05); }
  }

  /* ── Main Container ── */
  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 560px;
    padding: 24px 20px;
    display: flex; flex-direction: column; align-items: center;
    gap: 28px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
  }
  .header .brand {
    font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--gold);
    font-style: italic;
    line-height: 1;
  }
  .header .subtitle {
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── Mode Toggle ── */
  .mode-toggle {
    display: flex;
    background: rgba(255,255,255,0.03);
    border-radius: 40px;
    padding: 4px;
    border: 1px solid var(--border);
    gap: 2px;
  }
  .mode-btn {
    padding: 10px 28px;
    border-radius: 36px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.9rem;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 0.04em;
    position: relative;
  }
  .mode-btn.active {
    color: var(--text-bright);
    font-weight: 500;
  }
  .mode-btn.active.truth-mode {
    background: rgba(110, 181, 201, 0.15);
    box-shadow: 0 0 24px var(--glow-truth);
  }
  .mode-btn.active.dare-mode {
    background: rgba(201, 126, 110, 0.15);
    box-shadow: 0 0 24px var(--glow-dare);
  }
  .mode-btn:hover:not(.active) {
    color: var(--text);
    background: rgba(255,255,255,0.03);
  }
  .mode-icon { margin-right: 6px; }

  /* ── Category Pills ── */
  .categories {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 8px;
  }
  .cat-pill {
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    color: var(--text-dim);
    font-size: 0.78rem;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .cat-pill:hover {
    border-color: rgba(201, 169, 110, 0.4);
    color: var(--text);
    background: rgba(201, 169, 110, 0.06);
  }
  .cat-pill.active {
    border-color: var(--gold);
    background: rgba(201, 169, 110, 0.12);
    color: var(--gold-light);
    font-weight: 500;
    box-shadow: 0 0 16px rgba(201, 169, 110, 0.1);
  }

  /* ── Card Container ── */
  .card-stage {
    position: relative;
    width: 100%; max-width: 420px;
    height: 360px;
    perspective: 1000px;
  }

  .card-wrapper {
    position: absolute; inset: 0;
    transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    transform-style: preserve-3d;
  }

  /* ── The Card ── */
  .card {
    position: absolute; inset: 0;
    border-radius: 24px;
    background: var(--bg-card);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 44px 38px;
    text-align: center;
    box-shadow:
      0 8px 48px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.03);
    transition: all 0.5s ease;
    overflow: hidden;
  }

  /* Card decorative corner accents */
  .card::before {
    content: '';
    position: absolute;
    top: 18px; left: 18px;
    width: 28px; height: 28px;
    border-top: 1px solid rgba(201, 169, 110, 0.3);
    border-left: 1px solid rgba(201, 169, 110, 0.3);
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: 18px; right: 18px;
    width: 28px; height: 28px;
    border-bottom: 1px solid rgba(201, 169, 110, 0.3);
    border-right: 1px solid rgba(201, 169, 110, 0.3);
  }

  /* Card inner decorative line */
  .card-decoration {
    position: absolute;
    inset: 14px;
    border-radius: 16px;
    border: 1px solid rgba(201, 169, 110, 0.08);
    pointer-events: none;
  }

  /* Card surface shimmer */
  .card-shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(
      135deg,
      transparent 0%,
      rgba(255,255,255,0.015) 45%,
      rgba(255,255,255,0.03) 50%,
      rgba(255,255,255,0.015) 55%,
      transparent 100%
    );
    pointer-events: none;
    z-index: 0;
  }

  /* Card type badge */
  .card-type-badge {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
    font-style: italic;
    opacity: 0.8;
  }

  /* Card content */
  .card-content {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--text-bright);
    line-height: 1.75;
    letter-spacing: 0.03em;
    position: relative; z-index: 1;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: none;
    word-break: break-word;
  }
  .card-content::-webkit-scrollbar { display: none; }

  /* Card category tag */
  .card-cat-tag {
    margin-top: 16px;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* Card glow on type */
  .card.truth-card {
    box-shadow:
      0 8px 48px rgba(0,0,0,0.5),
      0 0 2px var(--glow-truth),
      inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .card.dare-card {
    box-shadow:
      0 8px 48px rgba(0,0,0,0.5),
      0 0 2px var(--glow-dare),
      inset 0 1px 0 rgba(255,255,255,0.03);
  }

  /* Card entrance animation */
  .card.entering {
    animation: cardEnter 0.55s cubic-bezier(0.23, 1, 0.32, 1);
  }
  @keyframes cardEnter {
    0%   { transform: scale(0.88); opacity: 0; }
    50%  { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* card leaving */
  .card.leaving {
    animation: cardLeave 0.3s ease-in forwards;
  }
  @keyframes cardLeave {
    to { transform: scale(0.92); opacity: 0; }
  }

  /* ── Draw Button ── */
  .draw-btn {
    position: relative;
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: rgba(201, 169, 110, 0.08);
    color: var(--gold-light);
    font-size: 1.4rem;
    cursor: pointer;
    transition: all 0.35s ease;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .draw-btn:hover {
    background: rgba(201, 169, 110, 0.18);
    box-shadow: 0 0 40px rgba(201, 169, 110, 0.25);
    transform: scale(1.06);
  }
  .draw-btn:active {
    transform: scale(0.94);
    transition: transform 0.1s ease;
  }
  .draw-btn.pulse {
    animation: btnPulse 2s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 16px rgba(201, 169, 110, 0.15); }
    50% { box-shadow: 0 0 36px rgba(201, 169, 110, 0.35); }
  }

  /* ── Bottom Bar ── */
  .bottom-bar {
    display: flex; align-items: center; gap: 24px;
    font-size: 0.7rem; color: var(--text-dim);
    letter-spacing: 0.06em;
  }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-val { color: var(--gold); font-weight: 500; font-size: 0.85rem; }

  /* ── History Drawer ── */
  .history-toggle {
    background: none; border: none;
    color: var(--text-dim);
    font-size: 0.72rem; cursor: pointer;
    letter-spacing: 0.08em;
    transition: color 0.3s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .history-toggle:hover { color: var(--gold); }

  .history-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(12, 12, 28, 0.95);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-top: 1px solid var(--border);
    z-index: 10;
    max-height: 45vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
    border-radius: 20px 20px 0 0;
  }
  .history-panel.open { transform: translateY(0); }
  .history-inner { padding: 24px 20px; max-width: 560px; margin: 0 auto; }
  .history-inner h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400; font-style: italic;
    color: var(--gold); font-size: 1.1rem;
    margin-bottom: 16px; letter-spacing: 0.06em;
  }
  .history-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 0.82rem;
  }
  .history-item .h-type {
    font-size: 0.65rem; padding: 2px 8px; border-radius: 10px;
    flex-shrink: 0; font-weight: 500;
  }
  .h-type.truth { background: rgba(110,181,201,0.15); color: var(--accent-truth); }
  .h-type.dare { background: rgba(201,126,110,0.15); color: var(--accent-dare); }
  .history-item .h-text { color: var(--text); line-height: 1.5; }
  .history-empty { color: var(--text-dim); font-size: 0.8rem; text-align: center; padding: 20px 0; }
  .history-clear {
    background: none; border: none; color: var(--text-dim);
    font-size: 0.7rem; cursor: pointer; margin-top: 12px;
    letter-spacing: 0.06em;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .history-clear:hover { color: var(--accent-dare); }

  .history-overlay, .remain-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 9; opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .history-overlay.show, .remain-overlay.show { opacity: 1; pointer-events: auto; }

  /* ── Remaining Cards Panel ── */
  .remain-toggle {
    background: none; border: none;
    color: var(--text-dim);
    font-size: 0.72rem; cursor: pointer;
    letter-spacing: 0.08em;
    transition: color 0.3s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .remain-toggle:hover { color: var(--gold); }

  .remain-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(12, 12, 28, 0.96);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-top: 1px solid var(--border);
    z-index: 10;
    max-height: 50vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
    border-radius: 20px 20px 0 0;
  }
  .remain-panel.open { transform: translateY(0); }
  .remain-inner { padding: 24px 20px; max-width: 560px; margin: 0 auto; }
  .remain-inner h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400; font-style: italic;
    color: var(--gold); font-size: 1.1rem;
    margin-bottom: 6px; letter-spacing: 0.06em;
  }
  .remain-subtitle {
    font-size: 0.68rem; color: var(--text-dim);
    margin-bottom: 18px; letter-spacing: 0.04em;
  }
  .remain-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  @media (max-width: 480px) {
    .remain-grid { grid-template-columns: 1fr; }
  }
  .remain-card-mini {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.76rem;
    color: var(--text);
    line-height: 1.5;
    position: relative;
    transition: all 0.25s ease;
    cursor: default;
  }
  .remain-card-mini:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(201, 169, 110, 0.2);
  }
  .remain-card-mini.truth-card-mini { border-left: 2px solid var(--accent-truth); }
  .remain-card-mini.dare-card-mini { border-left: 2px solid var(--accent-dare); }
  .remain-card-mini .rm-index {
    font-size: 0.6rem; color: var(--text-dim);
    margin-bottom: 4px; letter-spacing: 0.04em;
  }
  .remain-empty {
    color: var(--text-dim); font-size: 0.8rem; text-align: center;
    padding: 28px 0; grid-column: 1 / -1;
  }

  /* ── Toast ── */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(18,18,36,0.9); backdrop-filter: blur(16px);
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 10px 24px; border-radius: 24px;
    font-size: 0.78rem; z-index: 20;
    letter-spacing: 0.04em;
    animation: toastIn 0.4s ease, toastOut 0.4s ease 1.6s forwards;
    pointer-events: none;
  }
  @keyframes toastIn  { from { opacity: 0; transform: translateX(-50%) translateY(-12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

  /* ── Shuffle hint ── */
  .shuffle-hint {
    font-size: 0.65rem; color: var(--text-dim);
    letter-spacing: 0.06em;
    opacity: 0; transition: opacity 0.5s ease;
  }
  .shuffle-hint.visible { opacity: 0.6; }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .app { padding: 16px 12px; gap: 20px; }
    .header .brand { font-size: 2rem; }
    .card-stage { height: 320px; }
    .card { padding: 30px 24px; border-radius: 20px; }
    .card::before, .card::after { width: 20px; height: 20px; }
    .card-content { font-size: 1.02rem; max-height: 170px; }
    .cat-pill { padding: 6px 12px; font-size: 0.7rem; }
    .mode-btn { padding: 8px 18px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="ambient-orb orb-1"></div>
<div class="ambient-orb orb-2"></div>
<div class="ambient-orb orb-3"></div>
<canvas id="particles"></canvas>

<div class="app">
  <div class="header">
    <div class="brand">Vérité</div>
    <div class="subtitle">Truth &amp; Dare · 真心话大冒险</div>
  </div>

  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn truth-mode active" data-mode="truth">
      <span class="mode-icon">&#9670;</span>真心话
    </button>
    <button class="mode-btn dare-mode" data-mode="dare">
      <span class="mode-icon">&#9671;</span>大冒险
    </button>
  </div>

  <div class="categories" id="categories"></div>

  <div class="card-stage" id="cardStage">
    <div class="card-wrapper">
      <div class="card" id="theCard">
        <div class="card-shimmer"></div>
        <div class="card-decoration"></div>
        <div class="card-type-badge" id="cardBadge">TRUTH</div>
        <div class="card-content" id="cardContent">
          点击下方按钮<br>抽取你的第一张卡牌
        </div>
        <div class="card-cat-tag" id="cardCatTag"></div>
      </div>
    </div>
  </div>

  <button class="draw-btn pulse" id="drawBtn" title="抽取卡牌">
    &#9864;
  </button>

  <div class="bottom-bar">
    <div class="stat"><span>已抽</span><span class="stat-val" id="statDrawn">0</span></div>
    <div class="stat"><span>剩余</span><span class="stat-val" id="statRemain">0</span></div>
    <button class="remain-toggle" id="remainToggle">牌堆 ▸</button>
    <button class="history-toggle" id="historyToggle">历史 ▸</button>
  </div>

  <div class="shuffle-hint" id="shuffleHint">卡牌已重新洗牌</div>
</div>

<div class="history-overlay" id="historyOverlay"></div>
<div class="history-panel" id="historyPanel">
  <div class="history-inner">
    <h3>历史记录</h3>
    <div id="historyList"></div>
    <button class="history-clear" id="historyClear">清除记录</button>
  </div>
</div>

<div class="remain-overlay" id="remainOverlay"></div>
<div class="remain-panel" id="remainPanel">
  <div class="remain-inner">
    <h3>当前牌堆</h3>
    <div class="remain-subtitle" id="remainSubtitle"></div>
    <div class="remain-grid" id="remainGrid"></div>
  </div>
</div>

<script>
// ────────────────────────
//  PARTICLE SYSTEM
// ────────────────────────
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
let animFrame;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor() {
    this.reset(true);
  }
  reset(init) {
    this.x = Math.random() * canvas.width;
    this.y = init ? Math.random() * canvas.height : canvas.height + 10;
    this.size = Math.random() * 1.5 + 0.5;
    this.speedY = -(Math.random() * 0.35 + 0.08);
    this.speedX = (Math.random() - 0.5) * 0.2;
    this.opacity = Math.random() * 0.5 + 0.1;
    this.fadeSpeed = Math.random() * 0.003 + 0.001;
    this.twinkle = Math.random() * Math.PI * 2;
  }
  update() {
    this.y += this.speedY;
    this.x += this.speedX;
    this.twinkle += 0.02;
    if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
      this.reset(false);
    }
  }
  draw() {
    const twinkleOpacity = this.opacity + Math.sin(this.twinkle) * 0.15;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(201, 169, 110, ${Math.max(0, twinkleOpacity)})`;
    ctx.fill();
  }
}

for (let i = 0; i < 80; i++) {
  particles.push(new Particle());
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  animFrame = requestAnimationFrame(animateParticles);
}
animateParticles();

// ────────────────────────
//  CARD DATA
// ────────────────────────
const cardDecks = {
  classic: {
    name: '经典',

// ────────────────────────
//  GAME STATE
// ────────────────────────
let currentMode = 'truth';       // 'truth' | 'dare'
let currentCategory = 'classic'; // deck key
let drawnHistory = [];           // { type, text, category, time }
let deckStates = {};             // per-category shuffled decks

// Initialize decks
Object.keys(cardDecks).forEach(key => {
  deckStates[key] = { truth: [], dare: [] };
  reshuffleDeck(key, 'truth');
  reshuffleDeck(key, 'dare');
});

function reshuffleDeck(catKey, mode) {
  const cards = [...cardDecks[catKey][mode === 'truth' ? 'truths' : 'dares']];
  // Fisher-Yates shuffle
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  deckStates[catKey][mode] = cards;
}

function getDeck() {
  return deckStates[currentCategory][currentMode];
}

function remainCount() {
  return getDeck().length;
}

function drawCard() {
  const deck = getDeck();
  if (deck.length === 0) {
    reshuffleDeck(currentCategory, currentMode);
    showShuffleHint();
  }
  const card = deck.pop();
  // Record history
  drawnHistory.unshift({
    type: currentMode,
    text: card,
    category: currentCategory,
    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
  });
  // Keep only last 100
  if (drawnHistory.length > 100) drawnHistory.length = 100;
  return card;
}

// ────────────────────────
//  RENDER CATEGORIES
// ────────────────────────
function renderCategories() {
  categoriesEl.innerHTML = '';
  Object.entries(cardDecks).forEach(([key, deck]) => {
    const pill = document.createElement('button');
    pill.className = 'cat-pill' + (key === currentCategory ? ' active' : '');
    pill.textContent = deck.name;
    pill.addEventListener('click', () => {
      currentCategory = key;
      renderCategories();
      updateStats();
      if (remainPanel.classList.contains('open')) updateRemainUI();
      // Reset card display
      cardContent.innerHTML = '点击下方按钮<br>抽取你的第一张卡牌';
      cardBadge.textContent = currentMode === 'truth' ? 'TRUTH' : 'DARE';
      cardEl.className = 'card ' + (currentMode === 'truth' ? 'truth-card' : 'dare-card');
      cardCatTag.textContent = '';
    });
    categoriesEl.appendChild(pill);
  });
}
renderCategories();

// ────────────────────────
//  MODE TOGGLE
// ────────────────────────
modeToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-btn');
  if (!btn) return;
  currentMode = btn.dataset.mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  cardBadge.textContent = currentMode === 'truth' ? 'TRUTH' : 'DARE';
  cardEl.className = 'card ' + (currentMode === 'truth' ? 'truth-card' : 'dare-card');
  cardContent.innerHTML = '点击下方按钮<br>抽取你的第一张卡牌';
  cardCatTag.textContent = '';
  updateStats();
  if (remainPanel.classList.contains('open')) updateRemainUI();
  // Re-apply pulse if needed
  if (remainCount() > 0 && !drawBtn.classList.contains('pulse')) {
    drawBtn.classList.add('pulse');
  }
});

// ────────────────────────
//  DRAW CARD
// ────────────────────────
let isAnimating = false;

drawBtn.addEventListener('click', () => {
  if (isAnimating) return;
  isAnimating = true;
  drawBtn.classList.remove('pulse');

  // Leaving animation
  cardEl.classList.add('leaving');

  setTimeout(() => {
    const card = drawCard();
    cardEl.classList.remove('leaving');
    cardContent.textContent = card;
    cardBadge.textContent = currentMode === 'truth' ? 'TRUTH' : 'DARE';
    cardEl.className = 'card entering ' + (currentMode === 'truth' ? 'truth-card' : 'dare-card');
    cardCatTag.textContent = cardDecks[currentCategory].name;

    setTimeout(() => {
      cardEl.classList.remove('entering');
      isAnimating = false;
      drawBtn.classList.add('pulse');
    }, 550);

    updateStats();
    updateHistoryUI();
    if (remainPanel.classList.contains('open')) updateRemainUI();
  }, 300);
});

// ────────────────────────
//  STATS
// ────────────────────────
function updateStats() {
  statDrawn.textContent = drawnHistory.length;
  statRemain.textContent = remainCount();
}
updateStats();

// ────────────────────────
//  SHUFFLE HINT
// ────────────────────────
function showShuffleHint() {
  shuffleHint.classList.add('visible');
  setTimeout(() => shuffleHint.classList.remove('visible'), 2000);
}

// ────────────────────────
//  HISTORY PANEL
// ────────────────────────
function updateHistoryUI() {
  if (drawnHistory.length === 0) {
    historyList.innerHTML = '<div class="history-empty">还没有抽取过卡牌</div>';
    return;
  }
  historyList.innerHTML = drawnHistory.slice(0, 30).map(h => `
    <div class="history-item">
      <span class="h-type ${h.type}">${h.type === 'truth' ? '真心话' : '大冒险'}</span>
      <span class="h-text">${h.text}</span>
      <span style="color:var(--text-dim);font-size:0.65rem;flex-shrink:0;">${h.time}</span>
    </div>
  `).join('');
}
updateHistoryUI();

function openHistory() {
  closeRemain();
  historyPanel.classList.add('open');
  historyOverlay.classList.add('show');
  updateHistoryUI();
}
function closeHistory() {
  historyPanel.classList.remove('open');
  historyOverlay.classList.remove('show');
}

historyToggle.addEventListener('click', openHistory);
historyOverlay.addEventListener('click', closeHistory);
historyClear.addEventListener('click', () => {
  drawnHistory = [];
  updateHistoryUI();
  updateStats();
  updateRemainUI();
  showToast('历史记录已清除');
});

// ────────────────────────
//  REMAINING CARDS PANEL
// ────────────────────────
function updateRemainUI() {
  const deck = getDeck();
  const modeLabel = currentMode === 'truth' ? '真心话' : '大冒险';
  const catLabel = cardDecks[currentCategory].icon + ' ' + cardDecks[currentCategory].name;
  remainSubtitle.textContent = `${catLabel} · ${modeLabel} · 剩余 ${deck.length} 张`;

  if (deck.length === 0) {
    remainGrid.innerHTML = '<div class="remain-empty">牌堆已空，下次抽牌将自动洗牌</div>';
    return;
  }

  remainGrid.innerHTML = deck.map((text, i) => {
    const miniClass = currentMode === 'truth' ? 'truth-card-mini' : 'dare-card-mini';
    return `
      <div class="remain-card-mini ${miniClass}">
        <div class="rm-index">#${i + 1}</div>
        <div>${text}</div>
      </div>
    `;
  }).join('');
}

function openRemain() {
  closeHistory();
  remainPanel.classList.add('open');
  remainOverlay.classList.add('show');
  updateRemainUI();
}
function closeRemain() {
  remainPanel.classList.remove('open');
  remainOverlay.classList.remove('show');
}

remainToggle.addEventListener('click', openRemain);
remainOverlay.addEventListener('click', closeRemain);

// ────────────────────────
//  TOAST
// ────────────────────────
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2100);
}

// ────────────────────────
//  KEYBOARD SHORTCUTS
// ────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key.toLowerCase()) {
    case ' ':
    case 'enter':
      e.preventDefault();
      drawBtn.click();
      break;
    case 't':
      document.querySelector('[data-mode="truth"]').click();
      break;
    case 'd':
      document.querySelector('[data-mode="dare"]').click();
      break;
    case 'h':
      if (historyPanel.classList.contains('open')) closeHistory();
      else openHistory();
      break;
    case 'r':
      if (remainPanel.classList.contains('open')) closeRemain();
      else openRemain();
      break;
    case 'escape':
      if (historyPanel.classList.contains('open')) closeHistory();
      if (remainPanel.classList.contains('open')) closeRemain();
      break;
  }
});

// ────────────────────────
//  INIT
// ────────────────────────
cardEl.className = 'card truth-card';
cardBadge.textContent = 'TRUTH';
updateStats();

// ────────────────────────
//  SHAKE TO DRAW (mobile)
// ────────────────────────
let lastShakeTime = 0;
let shakeAccum = 0;
const SHAKE_THRESHOLD = 22;
const SHAKE_COOLDOWN = 1500;

if (window.DeviceMotionEvent) {
  window.addEventListener('devicemotion', (e) => {
    const acc = e.accelerationIncludingGravity;
    if (!acc) return;
    const magnitude = Math.sqrt(
      (acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2
    );
    if (magnitude > SHAKE_THRESHOLD) {
      const now = Date.now();
      if (now - lastShakeTime > SHAKE_COOLDOWN) {
        lastShakeTime = now;
        drawBtn.click();
        if (navigator.vibrate) navigator.vibrate(30);
      }
    }
  });
}
</script>
</body>
</html>
